<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OG</title>
  <style>
    html, body { margin: 0; padding: 0; width: 1200px; height: 630px; background: #0a0a0b; overflow: hidden; }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      color: #eceae4;
      position: relative;
      background-image:
        linear-gradient(to right, rgba(232,184,109,0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(232,184,109,0.08) 1px, transparent 1px);
      background-size: 72px 72px;
    }
    .frame { position: absolute; inset: 48px; border: 1px solid rgba(232,184,109,0.35); }
    .mark {
      position: absolute; top: 80px; right: 80px; width: 48px; height: 48px;
      border: 1.5px solid #e8b86d; display: flex; align-items: center; justify-content: center;
      color: #e8b86d; font-weight: 700; letter-spacing: 0.08em; font-size: 16px;
    }
    .loc { position: absolute; top: 96px; left: 80px; color: #e8b86d; letter-spacing: 0.32em; font-size: 16px; font-weight: 500; }
    h1 {
      position: absolute; top: 168px; left: 80px; margin: 0;
      font-family: Syne, ui-sans-serif, system-ui, sans-serif;
      font-size: 92px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em;
    }
    h1 span { color: #e8b86d; }
    .rule { position: absolute; top: 392px; left: 80px; width: 96px; height: 2px; background: #e8b86d; }
    .role { position: absolute; top: 424px; left: 80px; font-size: 26px; color: #9a968e; }
    .sub { position: absolute; top: 478px; left: 80px; font-size: 18px; color: #6b6862; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="mark">JD</div>
  <div class="loc">FOSTER CITY, CA</div>
  <h1>Jignesh<br/>Dhamecha<span>.</span></h1>
  <div class="rule"></div>
  <div class="role">Senior Frontend / Fullstack / AI Engineer</div>
  <div class="sub">14+ years product UI  ·  Agentic and generative interfaces</div>
</body>
</html>
